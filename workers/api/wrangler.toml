name = "weave-story-api"
main = "src/index.ts"
compatibility_date = "2025-05-13"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[observability]
enabled = true

[vars]
USE_STORY_HARNESS = "true"

[[queues.producers]]
binding = "STORY_GENERATION_QUEUE"
queue = "weave-story-generation-queue"

[[queues.consumers]]
queue = "weave-story-generation-queue"
max_batch_size = 1
max_batch_timeout = 0
max_retries = 3
dead_letter_queue = "weave-story-generation-dlq"

# Secrets — set with: npx wrangler secret put SECRET_NAME
# DATABASE_URL
# JWT_SECRET
# AI_GATEWAY_API_KEY
# CF_COVER_WORKER_URL
# APPLE_IAP_KEY_ID
# APPLE_IAP_ISSUER_ID
# APPLE_IAP_PRIVATE_KEY
# GOOGLE_IOS_CLIENT_ID
# GOOGLE_WEB_CLIENT_ID
