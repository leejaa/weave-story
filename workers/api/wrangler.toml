name = "weave-story-api"
# CI 토큰엔 account 조회 권한이 없어 자동 탐지가 실패한다(2026-06-18 배포 실패 원인).
# account_id 는 비밀이 아니므로 설정에 고정해 CI/로컬 모두 안정적으로 배포되게 한다.
account_id = "d82edb9e0df87cd8b607a0df0bca1b4b"
main = "src/index.ts"
compatibility_date = "2025-05-13"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[observability]
enabled = true

# 네이티브 Rate Limiting 바인딩(per-colo 슬라이딩 윈도우). period 는 10 또는 60만 허용.
# 인증: IP당 60초 30회(무차별 로그인 완화). 생성: userId당 60초 12회(AI 남용 완화).
[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "GEN_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 12, period = 60 }

# 토스(앱인토스) 파트너 API 호출용 mTLS 클라이언트 인증서 바인딩.
# env.TOSS_MTLS.fetch(...) 가 클라이언트 인증서를 제시해 상호 TLS 핸드셰이크.
[[mtls_certificates]]
binding = "TOSS_MTLS"
certificate_id = "6a7f22e1-e05b-40d0-ba3c-aff1b5d6735a"

# Google Play 환불(voided) 폴링 — 매일 1회(00:30 UTC).
[triggers]
crons = ["30 0 * * *"]

[[queues.producers]]
binding = "STORY_GENERATION_QUEUE"
queue = "weave-story-generation-queue"

[[queues.consumers]]
queue = "weave-story-generation-queue"
max_batch_size = 1
max_batch_timeout = 0
max_retries = 3
dead_letter_queue = "weave-story-generation-dlq"

# Secrets — set with: npx wrangler secret put SECRET_NAME
# DATABASE_URL
# JWT_SECRET
# AI_GATEWAY_API_KEY
# CF_COVER_WORKER_URL
# APPLE_IAP_KEY_ID
# APPLE_IAP_ISSUER_ID
# APPLE_IAP_PRIVATE_KEY
# GOOGLE_IOS_CLIENT_ID
# GOOGLE_WEB_CLIENT_ID
