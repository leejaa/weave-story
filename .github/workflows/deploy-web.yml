name: Deploy web

# web/ 변경이 main에 푸시되면:
#   - Cloudflare Pages (웹 SPA 미리보기용)
#   - 앱인토스 AIT 업로드 (검수 요청은 콘솔에서 수동)
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

jobs:
  deploy-pages:
    name: Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: d82edb9e0df87cd8b607a0df0bca1b4b
          workingDirectory: web
          command: pages deploy dist --project-name=weave-story-web --branch=main

      - name: Print deployment URL
        run: |
          {
            echo "### Cloudflare Pages 배포 완료"
            echo ""
            echo "| | URL |"
            echo "|---|---|"
            echo "| 프로덕션(고정) | https://weave-story-web.pages.dev |"
            echo "| 이번 배포 | ${{ steps.deploy.outputs.deployment-url }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-ait:
    name: 앱인토스 AIT 업로드
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build AIT
        run: npm run build:ait

      - name: Upload to 앱인토스
        run: npx ait deploy --api-key ${{ secrets.APPS_IN_TOSS_API_KEY }} -m "$(git log -1 --pretty='%s (%h)')"

      - name: Summary
        run: |
          {
            echo "### 앱인토스 AIT 업로드 완료"
            echo ""
            echo "콘솔에서 검토 요청 후 출시하세요."
            echo "https://console.toss.im/apps-in-toss"
          } >> "$GITHUB_STEP_SUMMARY"
